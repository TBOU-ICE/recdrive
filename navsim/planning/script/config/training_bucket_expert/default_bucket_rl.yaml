hydra:
  run:
    dir: ${output_dir}
  output_subdir: ${output_dir}/code/hydra
  searchpath:
    - pkg://navsim.planning.script.config.common
    - pkg://navsim.planning.script.config.training
  job:
    chdir: False

defaults:
  - default_common
  - default_evaluation
  - default_train_val_test_log_split
  - agent: recogdrive_agent
  - _self_

split: trainval
seed: 0
cache_path: ${oc.env:NAVSIM_EXP_ROOT}/training_cache_transfuser
use_cache_without_dataset: true
force_cache_computation: false

bucket:
  name: unset
  tokens_json: ''
  token_to_log_json: ''
  navtrain_output_dir: ''
  use_complement_for_full: true
  full_ratio: 0.2
  bucket_ratio: 0.8
  epoch_size: null
  cache_manifest: ''
  extra_cache_paths: []
  extra_cache_token_jsons: []
  extra_cache_manifests: []
  extra_metric_cache_paths: []

dataloader:
  params:
    batch_size: 8
    num_workers: 8
    pin_memory: true
    prefetch_factor: 2

trainer:
  params:
    max_epochs: 10
    check_val_every_n_epoch: 1
    val_check_interval: 1.0
    limit_train_batches: 1.0
    limit_val_batches: 1.0
    accelerator: gpu
    strategy: ddp
    precision: 16-mixed
    num_nodes: 1
    devices: 8
    num_sanity_val_steps: 0
    fast_dev_run: false
    accumulate_grad_batches: 1
    gradient_clip_val: 1.0
    gradient_clip_algorithm: norm
    default_root_dir: ${output_dir}
