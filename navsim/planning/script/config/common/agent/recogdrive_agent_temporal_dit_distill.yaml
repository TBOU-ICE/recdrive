_target_: navsim.agents.recogdrive.recogdrive_temporal_dit_distill_agent.ReCogDriveTemporalDiTDistillAgent
_convert_: 'all'

trajectory_sampling:
  _target_: nuplan.planning.simulation.trajectory.trajectory_sampling.TrajectorySampling
  _convert_: 'all'
  time_horizon: 4
  interval_length: 0.5

# VLM is not loaded online; use cached hidden states.
vlm_path: ''
vlm_type: 'internvl'
vlm_size: 'small'
dit_type: 'small'
sampling_method: 'ddim'
cache_mode: False
cache_hidden_state: True

# Student DiT checkpoint, normally IL or previous OPD-DiT checkpoint.
checkpoint_path: '/mnt/volumes/ad-e2e-al-sh01/nby/recdrive/ReCogDrive-2B-IL/ReCogDrive_Diffusion_Planner_2B_IL.ckpt'

# Frozen teacher DiT checkpoint, normally RecogDrive RL-DiT.
dit_distill: True
teacher_dit_checkpoint: '/mnt/volumes/ad-e2e-al-sh01/nby/recdrive/ReCogDrive-2B-RL/ReCogDrive_Diffusion_Planner_2B_RL.ckpt'
dit_distill_eps_clip: 0.2
dit_distill_min_sigma: 0.04
dit_distill_normalize_advantage: True
dit_distill_log_dir: ''
dit_distill_log_interval: 50

# EC-style temporal consistency loss.  Weight is applied after the raw temporal
# loss is computed; tune by monitoring temporal_loss / distill_loss.
dit_temporal_loss_weight: 0.05
dit_temporal_shift_steps: 1
dit_temporal_dt: 0.5
dit_temporal_pos_weight: 1.0
dit_temporal_heading_weight: 0.2
dit_temporal_acc_weight: 0.1
dit_temporal_jerk_weight: 0.05
dit_temporal_yaw_rate_weight: 0.1
dit_temporal_yaw_acc_weight: 0.05

# Disable other modes.
grpo: False
opd: False
train_backbone: False
reference_policy_checkpoint: ''
lr: 1e-4
