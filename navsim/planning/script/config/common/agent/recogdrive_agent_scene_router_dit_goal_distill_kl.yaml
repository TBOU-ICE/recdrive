# 方案一 (logprob-KL): scene-router goal-teacher OPD, matching the DDIM reverse
# transition MEAN (mu) instead of x0. Additive research config; does not affect
# the baseline (recogdrive_agent_scene_router_dit_goal_distill.yaml).
_target_: navsim.agents.recogdrive.recogdrive_scene_router_goal_agent_research.ReCogDriveSceneRouterGoalResearchAgent
_convert_: 'all'

trajectory_sampling:
  _target_: nuplan.planning.simulation.trajectory.trajectory_sampling.TrajectorySampling
  _convert_: 'all'
  time_horizon: 4
  interval_length: 0.5

checkpoint_path: '/workspace/models/recdrive/v1.0.0/training_dit_il_fullmix_simscale_newvlm/2026.07.27.11.45.27/lightning_logs/version_0/checkpoints/ckpt/epoch=2-step=4683.ckpt'

vlm_path: '/workspace/models/recdrive/v1.0.0/vlm_simscale_lora_merged'
cam_type: 'single'
vlm_type: 'internvl'
dit_type: 'small'
sampling_method: 'ddim'
cache_mode: false
cache_hidden_state: true
metric_cache_path: ''
reference_policy_checkpoint: ''
vlm_size: 'small'
train_backbone: false
grpo: false
lr: 1e-4

teacher_goal_mode: 'adaln'
teacher_ckpt_progress_curbside_stopgo: '/workspace/models/recdrive/v1.0.0/training_teacher_progress_curbside_stopgo_il_goal_adaln_newvlm/2026.08.04.10.54.30/lightning_logs/version_0/checkpoints/epoch=199-step=92800.ckpt'
