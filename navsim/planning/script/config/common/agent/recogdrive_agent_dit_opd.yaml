_target_: navsim.agents.recogdrive.recogdrive_agent.ReCogDriveAgent
_convert_: 'all'

trajectory_sampling:
  _target_: nuplan.planning.simulation.trajectory.trajectory_sampling.TrajectorySampling
  _convert_: 'all'
  time_horizon: 4
  interval_length: 0.5

# Use cached VLM hidden states from NAVSIM cache.  The VLM is fixed and is not
# loaded online; the same last_hidden_state is fed to both teacher and student DiT.
vlm_path: ''
vlm_type: 'internvl'
vlm_size: 'small'        # InternVL-2B hidden size = 1536
cache_mode: False
cache_hidden_state: True
train_backbone: False

# DiT planner architecture.  ReCogDrive-2B IL/RL planner checkpoints use this
# small DiT action-head config in the existing codebase.
dit_type: 'small'
sampling_method: 'ddim'

# Student DiT initialization: IL checkpoint requested by the user.
checkpoint_path: '/workspace/volumes/ad-e2e-al-sh01/nby/recdrive/ReCogDrive-2B-IL/ReCogDrive_Diffusion_Planner_2B_IL.ckpt'

# Frozen teacher DiT: RL checkpoint.  This can be either the .ckpt file or a
# directory containing the ckpt; the code now resolves both.
teacher_dit_checkpoint: '/workspace/volumes/ad-e2e-al-sh01/nby/recdrive/ReCogDrive-2B-RL/ReCogDrive_Diffusion_Planner_2B_RL.ckpt'

# Pure continuous DiT-OPD mode: diffusion reverse-transition KL on student
# on-policy denoising chains.  No VLM token OPD, no top-k, no PDM reward weighting.
dit_opd: True
dit_opd_sample_time: 1
dit_opd_min_kl_variance: 1.0e-4
dit_opd_max_kl_per_step: null
dit_opd_rollout_deterministic: False

# Disable other training modes.
opd: False
dit_distill: False
grpo: False
reference_policy_checkpoint: ''
metric_cache_path: ''

# Conservative LR for IL -> RL teacher transition-KL refinement.  Override from
# command line if needed, e.g. agent.lr=5e-5.
lr: 1e-5
