_target_: navsim.agents.recogdrive.recogdrive_scene_router_goal_agent.ReCogDriveSceneRouterGoalAgent
_convert_: 'all'

trajectory_sampling:
  _target_: nuplan.planning.simulation.trajectory.trajectory_sampling.TrajectorySampling
  _convert_: 'all'
  time_horizon: 4
  interval_length: 0.5

# student init = new-vlm IL base (representation-consistent with the caches/teachers).
checkpoint_path: '/workspace/models/recdrive/v1.0.0/training_dit_il_fullmix_simscale_newvlm/2026.07.27.11.45.27/lightning_logs/version_0/checkpoints/ckpt/epoch=2-step=4683.ckpt'

# new representation (must match the caches that produced the teachers)
vlm_path: '/workspace/models/recdrive/v1.0.0/vlm_simscale_lora_merged'
cam_type: 'single'
vlm_type: 'internvl'
dit_type: 'small'
sampling_method: 'ddim'
cache_mode: false
cache_hidden_state: true
metric_cache_path: ''
reference_policy_checkpoint: ''
vlm_size: 'small'
train_backbone: false
grpo: false
lr: 1e-4

# four scenario-expert teachers: goal-conditioned IL experts (adaln, epoch=199).
# teacher_goal_mode MUST match the mode these checkpoints were trained with;
# the agent refuses to load on mismatch or dead goal branches.
teacher_goal_mode: 'adaln'
teacher_ckpt_progress_curbside_stopgo: '/workspace/models/recdrive/v1.0.0/training_teacher_progress_curbside_stopgo_il_goal_adaln_newvlm/2026.08.04.10.54.30/lightning_logs/version_0/checkpoints/epoch=199-step=92800.ckpt'
teacher_ckpt_rule_intersection: '/workspace/models/recdrive/v1.0.0/training_teacher_rule_intersection_il_goal_adaln_newvlm/2026.08.02.16.39.57/lightning_logs/version_0/checkpoints/epoch=199-step=62800.ckpt'
teacher_ckpt_safety_dynamics_interaction: '/workspace/models/recdrive/v1.0.0/training_teacher_safety_dynamics_interaction_il_goal_adaln_newvlm/2026.08.04.10.25.26/lightning_logs/version_0/checkpoints/epoch=199-step=38800.ckpt'
teacher_ckpt_general_or_no_tag: '/workspace/models/recdrive/v1.0.0/training_teacher_general_or_no_tag_il_goal_adaln_newvlm/2026.08.04.10.44.01/lightning_logs/version_0/checkpoints/epoch=199-step=118000.ckpt'

# goal encoder hyper-params: MUST match the teacher training runs
goal_sincos_dim: 128
goal_hidden_dim: 1024
goal_use_heading: false

# token -> scenario bucket map ({token: bucket})
token_to_bucket_json: '/workspace/datasets/simscale/20260709/data/navtrain_scene/output/navtrain/exclusive_token_to_bucket.json'

teacher_select: 'scene_route'
match_target: 'x0'

# pure OPD (target == goal-conditioned expert). ExOPD ref only loads when != 1.0.
exopd_ref_checkpoint: '/workspace/models/recdrive/v1.0.0/training_dit_il_fullmix_simscale_newvlm/2026.07.27.11.45.27/lightning_logs/version_0/checkpoints/ckpt/epoch=2-step=4683.ckpt'
exopd_lambda: 1.0

scene_router_min_sigma: 0.04
scene_router_smooth_weight: 0.02

# diagnostics
collect_viz: true
viz_interval_steps: 500
