_target_: navsim.agents.recogdrive.recogdrive_temporal_multi_teacher_dit_distill_agent.ReCogDriveTemporalMultiTeacherDiTDistillAgent
_convert_: 'all'

trajectory_sampling:
  _target_: nuplan.planning.simulation.trajectory.trajectory_sampling.TrajectorySampling
  _convert_: 'all'
  time_horizon: 4
  interval_length: 0.5

# VLM is not loaded online; use cached hidden states.
vlm_path: ''
vlm_type: 'internvl'
vlm_size: 'small'
dit_type: 'small'
sampling_method: 'ddim'
cache_mode: False
cache_hidden_state: True

# Student DiT checkpoint (IL or previous distill checkpoint).
checkpoint_path: '/mnt/volumes/ad-e2e-al-sh01/nby/recdrive/ReCogDrive-2B-IL/ReCogDrive_Diffusion_Planner_2B_IL.ckpt'

# Dual frozen teacher DiTs.
dit_distill: True
teacher_dit_checkpoint_il: '/mnt/volumes/ad-e2e-al-sh01/nby/recdrive/ReCogDrive-2B-IL/ReCogDrive_Diffusion_Planner_2B_IL.ckpt'
teacher_dit_checkpoint_rl: '/mnt/volumes/ad-e2e-al-sh01/nby/recdrive/ReCogDrive-2B-RL/ReCogDrive_Diffusion_Planner_2B_RL.ckpt'
# Backward-compatible alias; ignored when teacher_dit_checkpoint_rl is set.
teacher_dit_checkpoint: ''

# Dual-teacher KL distillation weights (IL: EC-oriented, RL: PDMS-oriented).
dit_distill_il_weight: 0.75
dit_distill_rl_weight: 0.25
dit_distill_eps_clip: 0.2
dit_distill_min_sigma: 0.04
dit_distill_normalize_advantage: True
dit_distill_log_dir: ''
dit_distill_log_interval: 50

# EC-style temporal consistency loss.
# Tune dit_temporal_loss_weight by monitoring temporal_loss / distill_loss.
dit_temporal_loss_weight: 0.05
dit_temporal_shift_steps: 1
dit_temporal_dt: 0.5
dit_temporal_pos_weight: 1.0
dit_temporal_heading_weight: 0.2
dit_temporal_acc_weight: 0.1
dit_temporal_jerk_weight: 0.05
dit_temporal_yaw_rate_weight: 0.1
dit_temporal_yaw_acc_weight: 0.05

# Disable other modes.
grpo: False
opd: False
train_backbone: False
reference_policy_checkpoint: ''
lr: 1e-4
