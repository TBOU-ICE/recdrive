# Plan B: GRPO RL with temporal consistency as part of the REWARD
# combined_reward = pdms_weight * PDMS + temporal_weight * temporal_consistency
# Batch: temporal pair format [cur, next, cur, next, ...]
# Training script: run_training_recogdrive_temporal_rl.py
_target_: navsim.agents.recogdrive.recogdrive_temporal_reward_rl_agent.ReCogDriveTemporalRewardRLAgent
_convert_: 'all'

trajectory_sampling:
  _target_: nuplan.planning.simulation.trajectory.trajectory_sampling.TrajectorySampling
  _convert_: 'all'
  time_horizon: 4
  interval_length: 0.5

# VLM backbone (only cached hidden states used in GRPO).
vlm_path: ''
vlm_type: 'internvl'
vlm_size: 'small'
dit_type: 'small'
sampling_method: 'ddim'
cache_mode: False
cache_hidden_state: True

# Student DiT checkpoint (IL or previous RL checkpoint).
checkpoint_path: ''

# GRPO / RL settings.
grpo: True
metric_cache_path: ''
reference_policy_checkpoint: ''
lr: 1e-4

# Disable other modes.
opd: False
dit_distill: False
train_backbone: False

# Temporal reward hyper-parameters.
# Start with rl_temporal_reward_weight=0.1: temporal reward adds ~10% on
# top of PDMS after min-max normalisation.  Increase if EC drop persists.
rl_pdms_weight: 1.0
rl_temporal_reward_weight: 0.1
rl_temporal_shift_steps: 1
rl_temporal_pos_weight: 1.0
rl_temporal_heading_weight: 0.2
rl_temporal_normalize_temporal: True
rl_grpo_sample_time: 8
rl_bc_coeff: 0.1
