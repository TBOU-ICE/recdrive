# Plan A: GRPO RL + temporal consistency AUXILIARY LOSS
# Batch: temporal pair format [cur, next, cur, next, ...]
# Training script: run_training_recogdrive_temporal_rl.py
_target_: navsim.agents.recogdrive.recogdrive_temporal_rl_agent.ReCogDriveTemporalRLAgent
_convert_: 'all'

trajectory_sampling:
  _target_: nuplan.planning.simulation.trajectory.trajectory_sampling.TrajectorySampling
  _convert_: 'all'
  time_horizon: 4
  interval_length: 0.5

# VLM backbone (only cached hidden states used in GRPO).
vlm_path: ''
vlm_type: 'internvl'
vlm_size: 'small'
dit_type: 'small'
sampling_method: 'ddim'
cache_mode: False
cache_hidden_state: True

# Student DiT checkpoint (IL or previous RL checkpoint).
checkpoint_path: ''

# GRPO / RL settings.
grpo: True
metric_cache_path: ''
reference_policy_checkpoint: ''
lr: 1e-4

# Disable other modes.
opd: False
dit_distill: False
train_backbone: False

# Temporal auxiliary loss hyper-parameters.
# λ=0.05 is a safe starting point: temporal_loss ≈ 5% of GRPO loss.
rl_temporal_loss_weight: 0.05
rl_temporal_shift_steps: 1
rl_temporal_dt: 0.5
rl_temporal_pos_weight: 1.0
rl_temporal_heading_weight: 0.2
rl_temporal_acc_weight: 0.1
rl_temporal_jerk_weight: 0.05
rl_temporal_yaw_rate_weight: 0.1
rl_temporal_yaw_acc_weight: 0.05
rl_temporal_min_sigma: 0.04
