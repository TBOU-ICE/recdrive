# Expert-Reward RL Agent: expert IL anchor (strong supervised signal)
#
# Reward:  combined_reward = pdms_weight * PDMS
#                          + temporal_weight * temporal_consistency
#
# Expert IL anchor: expert_il_loss = DiT denoising loss with pseudo-expert traj as x_0
#
# Total loss = GRPO_policy_loss(combined_reward) + expert_il_weight * expert_il_loss
#
# Batch: temporal pair format [cur, next, cur, next, ...]
# Training script: run_training_recogdrive_temporal_rl.py
_target_: navsim.agents.recogdrive.recogdrive_expert_reward_rl_agent.ReCogDriveExpertRewardRLAgent
_convert_: 'all'

trajectory_sampling:
  _target_: nuplan.planning.simulation.trajectory.trajectory_sampling.TrajectorySampling
  _convert_: 'all'
  time_horizon: 4
  interval_length: 0.5

# VLM backbone (only cached hidden states used in GRPO).
vlm_path: ''
vlm_type: 'internvl'
vlm_size: 'small'
dit_type: 'small'
sampling_method: 'ddim'
cache_mode: False
cache_hidden_state: True

# Student DiT checkpoint (IL or previous RL checkpoint).
checkpoint_path: ''

# GRPO / RL settings.
grpo: True
metric_cache_path: ''
reference_policy_checkpoint: ''
lr: 1e-4

# Disable other modes.
opd: False
dit_distill: False
train_backbone: False

# ── Inherited temporal-consistency reward hyper-parameters ───────────────────
# Keep the same defaults as recogdrive_agent_temporal_reward_rl.yaml so a
# fine-tune from a temporal-RL checkpoint is numerically comparable.
rl_pdms_weight: 1.0
rl_temporal_reward_weight: 0.1
rl_temporal_shift_steps: 1
rl_temporal_pos_weight: 1.0
rl_temporal_heading_weight: 0.2
rl_temporal_normalize_temporal: True
rl_grpo_sample_time: 8
# bc_coeff is kept for API compatibility but NOT used (expert IL replaces it).
rl_bc_coeff: 0.0

# ── Expert IL anchor ──────────────────────────────────────────────────────────
# expert_il_weight: weight on denoising IL loss relative to policy_loss.
#   0.5 makes expert IL the primary EC-preservation signal.
#   Increase to 1.0 if EC is still dropping; decrease toward 0.2 if PDMS stalls.
expert_data_path: ''   # override via CLI: agent.expert_data_path=<path>
expert_il_weight: 0.5
