# Deployable GoalBridge student for PDMS. Predicted goal only; no GT goal, no teachers.
_target_: navsim.agents.recogdrive.recogdrive_goalbridge_eval_agent.ReCogDriveGoalBridgeEvalAgent
_convert_: 'all'

trajectory_sampling:
  _target_: nuplan.planning.simulation.trajectory.trajectory_sampling.TrajectorySampling
  _convert_: 'all'
  time_horizon: 4
  interval_length: 0.5

checkpoint_path: ''
vlm_path: ''
cam_type: 'single'
vlm_type: 'internvl'
dit_type: 'small'
sampling_method: 'ddim'
cache_mode: False
cache_hidden_state: False
metric_cache_path: ''
reference_policy_checkpoint: ''
vlm_size: 'small'
train_backbone: false
grpo: False
lr: 1e-4

student_goal_mode: 'adaln'
goal_sincos_dim: 128
goal_hidden_dim: 1024
goal_use_heading: false
goal_predictor_hidden_dim: 512
goal_predictor_dropout: 0.0
student_adaln_bound: 8.0
